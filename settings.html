<div class="igs-container">
    <!-- Master Drawer wrapper -->
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b data-i18n="igs.app.title">Image Generation Suite</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">

            <section class="igs-global-config-card" aria-label="Global configuration" data-i18n="[aria-label]igs.settings.globalConfig">
                <div class="igs-global-config-profile">
                    <strong data-i18n="igs.settings.profile">Profile</strong>
                    <div class="igs-profile-bar">
                        <select id="igs_profile_select" class="text_pole" title="Select Profile" data-i18n="[title]igs.profile.select"></select>
                        <div class="igs-profile-actions">
                            <div id="igs_profile_add" class="menu_button menu_button_icon" title="New Profile" data-i18n="[title]igs.profile.new">
                                <i class="fa-solid fa-plus"></i>
                            </div>
                            <div id="igs_profile_duplicate" class="menu_button menu_button_icon" title="Duplicate Profile" data-i18n="[title]igs.profile.duplicate">
                                <i class="fa-solid fa-copy"></i>
                            </div>
                            <div id="igs_profile_rename" class="menu_button menu_button_icon" title="Rename Profile" data-i18n="[title]igs.profile.rename">
                                <i class="fa-solid fa-pencil"></i>
                            </div>
                            <div id="igs_profile_delete" class="menu_button menu_button_icon" title="Delete Profile" data-i18n="[title]igs.profile.delete">
                                <i class="fa-solid fa-trash-can"></i>
                            </div>
                            <div id="igs_profile_export" class="menu_button menu_button_icon" title="Export Profile" data-i18n="[title]igs.profile.export">
                                <i class="fa-solid fa-file-export"></i>
                            </div>
                            <div id="igs_profile_import" class="menu_button menu_button_icon" title="Import Profile" data-i18n="[title]igs.profile.import">
                                <i class="fa-solid fa-file-import"></i>
                            </div>
                        </div>
                        <input type="file" id="igs_profile_import_file" accept=".json" style="display: none;">
                    </div>
                </div>
                <label class="igs-global-config-enable" for="igs_extension_enabled">
                    <input type="checkbox" id="igs_extension_enabled" class="checkbox">
                    <span data-i18n="igs.settings.enableExtension">Enable Extension</span>
                </label>
            </section>

            <!-- Inline quick controls and settings tabs are mounted here. -->
            <div id="igs_settings_panel"></div>

        </div>
    </div>
</div>
